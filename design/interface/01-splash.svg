<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1396" viewBox="0 0 1440 1396" font-family="Golos Text, system-ui, sans-serif">
  <title>neighbro — screen 1, loading, and a year of birth</title>
  <desc>The loading animation and the first step of signing up on one screen. The live numbers are not decoration — they are what there is to look at while it loads. Нарисовано по ../../docs/01-*_RU.md; цвета сняты с landing/index.html.</desc>
  <style>
    @import url("../../landing/fonts.css");
    /* Colour lives in style, never in a fill attribute: a class outranks the
       attribute, so a per-element fill="…" is thrown away and the label is
       painted in the class colour on top of its own ground. */
    .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #ede8dd; }
    .body  { font-size: 13px; font-weight: 500; fill: #ede8dd; }
    .msg   { font-size: 14px; font-weight: 500; fill: #ede8dd; }
    .small { font-size: 11px; font-weight: 500; fill: #ede8dd; }
    .muted { font-size: 12px; font-weight: 500; fill: #928979; }
    .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #928979; }
    .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #c6a24e; font-weight: 600; }
    .warn  { font-size: 11px; font-weight: 600; fill: #c6a24e; }
    /* neighbro's prototype sets a live message's timer in the accent, uppercase
       and wide. sosed has no such thing — there the timer is a plain caption. */
    .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #c6a24e; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="1440" height="1396" rx="0" fill="#0c0b09"/>
    <g transform="translate(48,40)">
      <rect x="0" y="0" width="1344" height="104" rx="16" fill="#c6a24e"/>
      <text x="28" y="46" class="disp" font-size="30" style="fill:#1a1509">Screen 1. loading, and a year of birth</text>
      <text x="28" y="74" class="body" style="fill:#1a1509">The loading animation and the first step of signing up on one screen. The live numbers are not decoration — they are what there is to look at while it loads.</text>
      <text x="1316" y="46" class="mono" style="fill:#1a1509" text-anchor="end">design/interface/01-splash.svg</text>
      <text x="1316" y="74" class="mono" style="fill:#1a1509" text-anchor="end">по ../../docs/01-splash-screen_RU.md</text>
    </g>
    <g transform="translate(48,184)">
      <text x="0" y="16" class="disp" font-size="19">Phone · 390 × 844</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a331f" stroke-width="1"/>
      <text x="0" y="48" class="muted">True geometry, no scaling.</text>
    </g>
  <g transform="translate(48,256)">
    <text x="0" y="0" class="brow">SPLASH</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0c0b09"/>
      <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
      <circle cx="90" cy="150" r="22" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <circle cx="90" cy="150" r="14" fill="#c6a24e" opacity="0.8"/>
      <circle cx="180" cy="110" r="16" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <circle cx="180" cy="110" r="8" fill="#c6a24e" opacity="0.5"/>
      <circle cx="270" cy="160" r="20" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <circle cx="270" cy="160" r="12" fill="#c6a24e" opacity="0.8"/>
      <circle cx="130" cy="220" r="14" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <circle cx="130" cy="220" r="6" fill="#c6a24e" opacity="0.5"/>
      <circle cx="240" cy="235" r="18" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <circle cx="240" cy="235" r="10" fill="#c6a24e" opacity="0.8"/>
      <text x="187" y="300" class="brow" text-anchor="middle">nearby right now</text>
      <text x="187" y="340" class="disp" font-size="34" text-anchor="middle">128</text>
      <text x="187" y="366" class="mono" text-anchor="middle">messages in the last hour · 41</text>
      <text x="187" y="440" class="brow" text-anchor="middle">YEAR OF BIRTH</text>
      <text x="187" y="480" class="muted" text-anchor="middle">1996</text>
      <text x="187" y="514" class="disp" font-size="30" text-anchor="middle">1997</text>
      <text x="187" y="548" class="muted" text-anchor="middle">1998</text>
      <line x1="90" y1="496" x2="284" y2="496" stroke="#3a331f" stroke-width="1"/>
      <line x1="90" y1="560" x2="284" y2="560" stroke="#3a331f" stroke-width="1"/>
      <text x="187" y="620" class="mono" text-anchor="middle">the year only — no day, no month</text>
      <circle cx="187" cy="720" r="32" fill="#c6a24e"/>
      <text x="187" y="730" class="disp" font-size="24" style="fill:#1a1509" text-anchor="middle">→</text>
    </g>
  </g>
    <g transform="translate(48,1160)">
      <text x="0" y="16" class="disp" font-size="19">Left open by the screen's description</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a331f" stroke-width="1"/>
    </g>
    <g transform="translate(48,1200)">
      <rect x="0" y="0" width="1344" height="112" rx="16" fill="#14120e" stroke="#c6a24e" stroke-width="2"/>
      <text x="24" y="34" class="warn">Two questions the description leaves open.</text>
      <text x="24" y="58" class="body">The icon set for the animation is undecided — the circles here are the space it will take.</text>
      <text x="24" y="82" class="body">The forward button's icon is undecided. An arrow is drawn as the most neutral mark there is.</text>
    </g>
    <g transform="translate(48,1336)">
      <rect x="0" y="-8" width="1344" height="36" rx="10" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <text x="24" y="16" class="mono">Цвета — landing/index.html, шрифт — landing/fonts.css. Брат: sosed.place/design/interface/</text>
    </g>
</svg>
