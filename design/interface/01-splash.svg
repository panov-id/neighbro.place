    <g transform="translate(525,256)">
      <rect x="0" y="0" width="867" height="128" rx="16" fill="#14120e" stroke="#c6a24e" stroke-width="2"/>
      <text x="24" y="30" class="brow">LEFT OPEN BY THE DESCRIPTION</text>
      <text x="24" y="56" class="warn">Two questions the description leaves open.</text>
      <text x="24" y="80" class="body">The icon set for the animation is undecided — the circles here are the space it will take.</text>
      <text x="24" y="104" class="body">The forward button's icon is undecided. An arrow is drawn as the most neutral mark there is.</text>
