      <text x="178" y="63" class="small">NEUKÖLLN · 29</text>
      <rect x="258" y="44" width="100" height="30" rx="15" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <circle cx="276" cy="59" r="7" fill="none" stroke="#928979" stroke-width="1"/>
      <text x="292" y="63" class="small">You</text>
      <line x1="0" y1="96" x2="374" y2="96" stroke="#3a331f" stroke-width="1"/>
      <rect x="16" y="130" width="300" height="64" rx="16" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <text x="32" y="156" class="msg">Heard it. Thought it was in my head.</text>
      <text x="32" y="178" class="mono">14:33</text>
      <rect x="118" y="206" width="240" height="64" rx="16" fill="#c6a24e"/>
      <text x="134" y="232" class="msg" style="fill:#1a1509">So there are two of us.</text>
      <text x="134" y="254" class="mono" style="fill:#1a1509">14:35 · DELIVERED</text>
      <rect x="16" y="282" width="280" height="64" rx="16" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <text x="32" y="308" class="msg">Same window every morning.</text>
      <text x="32" y="330" class="mono">14:36</text>
      <rect x="98" y="358" width="260" height="64" rx="16" fill="#c6a24e"/>
      <text x="114" y="384" class="msg" style="fill:#1a1509">Shall we check together tomorrow?</text>
      <text x="114" y="406" class="mono" style="fill:#1a1509">14:38 · DELIVERED</text>
      <rect x="16" y="470" width="342" height="96" rx="16" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
      <text x="32" y="498" class="brow">WHAT IS DIFFERENT HERE</text>
      <text x="32" y="522" class="mono">a chat does not vanish after 4:20 —</text>
      <text x="32" y="540" class="mono">it lives as long as the chat does</text>
      <text x="32" y="558" class="mono">kept on the device, encrypted</text>
      <text x="16" y="604" class="mono">every message takes the same check</text>
      <text x="16" y="622" class="mono">as the feed, minus captcha and rate limit</text>
      <rect x="16" y="700" width="278" height="44" rx="12" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <text x="32" y="728" class="small" style="fill:#928979">write…</text>
      <circle cx="332" cy="722" r="22" fill="#c6a24e"/>
      <text x="332" y="729" class="disp" font-size="20" style="fill:#1a1509" text-anchor="middle">↑</text>
    </g>
  </g>
