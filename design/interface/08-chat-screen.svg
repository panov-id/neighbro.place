    <g transform="translate(525,256)">
      <rect x="0" y="0" width="867" height="128" rx="16" fill="#14120e" stroke="#c6a24e" stroke-width="2"/>
      <text x="24" y="30" class="brow">LEFT OPEN BY THE DESCRIPTION</text>
      <text x="24" y="56" class="warn">The description leaves nothing open here.</text>
      <text x="24" y="80" class="body">Storage is named plainly: IndexedDB on the device, encrypted with Web Crypto before it is written.</text>
      <text x="24" y="104" class="body">There is no such thing as a browser's “secure” store, and the description says so.</text>
