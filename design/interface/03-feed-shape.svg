<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1396" viewBox="0 0 1440 1396" font-family="Golos Text, system-ui, sans-serif">
  <title>neighbro — screen 3, the feed, in its own shape</title>
  <desc>A bar of four, a hard accent shadow on what just arrived, and a one-at-a-time mode with skip and join — taken from this product's own prototype. Нарисовано по ../../docs/03-*_RU.md; цвета сняты с landing/index.html.</desc>
  <style>
    @import url("../../landing/fonts.css");
    /* Colour lives in style, never in a fill attribute: a class outranks the
       attribute, so a per-element fill="…" is thrown away and the label is
       painted in the class colour on top of its own ground. */
    .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #ede8dd; }
    .body  { font-size: 13px; font-weight: 500; fill: #ede8dd; }
    .msg   { font-size: 14px; font-weight: 500; fill: #ede8dd; }
    .small { font-size: 11px; font-weight: 500; fill: #ede8dd; }
    .muted { font-size: 12px; font-weight: 500; fill: #928979; }
    .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #928979; }
    .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #c6a24e; font-weight: 600; }
    .warn  { font-size: 11px; font-weight: 600; fill: #c6a24e; }
    /* neighbro's prototype sets a live message's timer in the accent, uppercase
       and wide. sosed has no such thing — there the timer is a plain caption. */
    .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #c6a24e; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="1440" height="1396" rx="0" fill="#0c0b09"/>
    <g transform="translate(48,40)">
      <rect x="0" y="0" width="1344" height="104" rx="16" fill="#c6a24e"/>
      <text x="28" y="46" class="disp" font-size="30" style="fill:#1a1509">Screen 3. the feed, in its own shape</text>
      <text x="28" y="74" class="body" style="fill:#1a1509">A bar of four, a hard accent shadow on what just arrived, and a one-at-a-time mode with skip and join — taken from this product's own prototype.</text>
      <text x="1316" y="46" class="mono" style="fill:#1a1509" text-anchor="end">design/interface/03-feed-shape.svg</text>
      <text x="1316" y="74" class="mono" style="fill:#1a1509" text-anchor="end">по ../../docs/03-feed-screen_RU.md</text>
    </g>
    <g transform="translate(48,184)">
      <text x="0" y="16" class="disp" font-size="19">Phone · 390 × 844</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a331f" stroke-width="1"/>
      <text x="0" y="48" class="muted">True geometry, no scaling.</text>
    </g>
  <g transform="translate(48,256)">
    <text x="0" y="0" class="brow">FEED</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0c0b09"/>
      <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
      <rect x="16" y="44" width="128" height="30" rx="15" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <path d="M32 52 q6 0 6 6 q0 5 -6 10 q-6 -5 -6 -10 q0 -6 6 -6 z" fill="none" stroke="#c6a24e" stroke-width="2"/>
      <text x="46" y="64" class="mono">kreuzberg · 1.2 km</text>
      <circle cx="166" cy="59" r="4" fill="#c6a24e"/>
      <text x="178" y="63" class="small">34 nearby</text>
      <rect x="258" y="44" width="100" height="30" rx="15" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <circle cx="276" cy="59" r="7" fill="none" stroke="#928979" stroke-width="1"/>
      <text x="292" y="63" class="small">You</text>
      <line x1="0" y1="96" x2="374" y2="96" stroke="#3a331f" stroke-width="1"/>
      <rect x="16" y="122" width="342" height="98" rx="16" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
      <text x="32" y="146" class="brow">KREUZBERG · 27</text>
      <text x="32" y="170" class="msg">The corner café put a piano</text>
      <text x="32" y="190" class="msg">outside. Anyone may play.</text>
      <text x="32" y="212" class="mono">08:12</text>
      <circle cx="332" cy="148" r="16" fill="none" stroke="#3a331f" stroke-width="1"/>
      <text x="332" y="154" class="disp" font-size="16" style="fill:#c6a24e" text-anchor="middle">+</text>
      <rect x="16" y="236" width="342" height="78" rx="16" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
      <text x="32" y="260" class="brow">NEUKÖLLN · 29</text>
      <text x="32" y="284" class="msg">Blue scarf left by the canal</text>
      <text x="32" y="306" class="mono">08:12</text>
      <circle cx="332" cy="262" r="16" fill="none" stroke="#3a331f" stroke-width="1"/>
      <text x="332" y="268" class="disp" font-size="16" style="fill:#c6a24e" text-anchor="middle">+</text>
      <rect x="21" y="335" width="342" height="98" rx="16" fill="#c6a24e"/>
      <rect x="16" y="330" width="342" height="98" rx="16" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
      <text x="32" y="354" class="brow">MITTE · 31</text>
      <text x="32" y="378" class="msg">Anyone else hear that brass</text>
      <text x="32" y="398" class="msg">band in the yard at seven?</text>
      <text x="32" y="420" class="timer">14:32 · 2H 40M LEFT</text>
      <circle cx="332" cy="356" r="16" fill="none" stroke="#3a331f" stroke-width="1"/>
      <text x="332" y="362" class="disp" font-size="16" style="fill:#c6a24e" text-anchor="middle">+</text>
      <line x1="0" y1="742" x2="374" y2="742" stroke="#3a331f" stroke-width="1"/>
      <rect x="36" y="766" width="22" height="3" rx="1" fill="#c6a24e"/>
      <rect x="36" y="773" width="15" height="3" rx="1" fill="#c6a24e"/>
      <text x="47" y="806" class="mono" style="fill:#c6a24e" text-anchor="middle">Feed</text>
      <rect x="129" y="766" width="22" height="3" rx="1" fill="#928979"/>
      <rect x="129" y="773" width="15" height="3" rx="1" fill="#928979"/>
      <text x="140" y="806" class="mono" text-anchor="middle">Chats</text>
      <circle cx="233" cy="776" r="20" fill="#c6a24e"/>
      <text x="233" y="784" class="disp" font-size="20" style="fill:#1a1509" text-anchor="middle">+</text>
      <text x="233" y="806" class="mono" text-anchor="middle">Say</text>
      <rect x="315" y="766" width="22" height="3" rx="1" fill="#928979"/>
      <rect x="315" y="773" width="15" height="3" rx="1" fill="#928979"/>
      <text x="326" y="806" class="mono" text-anchor="middle">Me</text>
      <text x="16" y="700" class="mono">what just arrived throws a hard shadow</text>
    </g>
  </g>
  <g transform="translate(525,256)">
    <text x="0" y="0" class="brow">ONE AT A TIME</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0c0b09"/>
      <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
      <text x="24" y="66" class="mono">3 / 34</text>
      <text x="350" y="68" class="disp" font-size="16" style="fill:#928979" text-anchor="end">✕</text>
      <rect x="24" y="150" width="326" height="320" rx="16" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
      <text x="48" y="190" class="brow">MITTE · 24</text>
      <text x="48" y="240" class="msg" font-size="17">Anyone up for a morning</text>
      <text x="48" y="266" class="msg" font-size="17">espresso before work?</text>
      <text x="48" y="330" class="mono">two of us · 400 m</text>
      <text x="48" y="430" class="timer">FRESH · 4H 02M</text>
      <text x="187" y="520" class="mono" text-anchor="middle">swipe left to skip · swipe right to join</text>
      <rect x="24" y="700" width="150" height="44" rx="12" fill="none" stroke="#3a331f" stroke-width="1"/>
      <text x="99.0" y="728" class="small" text-anchor="middle">Skip</text>
      <rect x="200" y="700" width="150" height="44" rx="12" fill="#c6a24e"/>
      <text x="275.0" y="728" class="small" style="fill:#1a1509;font-weight:700" text-anchor="middle">I'm in</text>
    </g>
  </g>
    <g transform="translate(48,1160)">
      <text x="0" y="16" class="disp" font-size="19">Left open by the screen's description</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a331f" stroke-width="1"/>
    </g>
    <g transform="translate(48,1200)">
      <rect x="0" y="0" width="1344" height="112" rx="16" fill="#14120e" stroke="#c6a24e" stroke-width="2"/>
      <text x="24" y="34" class="warn">This is an addition to screen 3, not a replacement.</text>
      <text x="24" y="58" class="body">It shows what this product's shape is: the bar, the shadow on the fresh card, the viewer.</text>
      <text x="24" y="82" class="body">The viewer and the chats/requests tabs come from prototype/neighbro-app-proto.html.</text>
    </g>
    <g transform="translate(48,1336)">
      <rect x="0" y="-8" width="1344" height="36" rx="10" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <text x="24" y="16" class="mono">Цвета — landing/index.html, шрифт — landing/fonts.css. Брат: sosed.place/design/interface/</text>
    </g>
</svg>
