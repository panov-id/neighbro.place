<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="4576" viewBox="0 0 1440 2288" font-family="Golos Text, system-ui, sans-serif">
  <title>neighbro — screen 6, the match, and the chat</title>
  <desc>A mutual like opens the chat and shows what matched. The next like does not start a second one. Обе темы. Нарисовано по ../../docs/06-match-and-chat_RU.md; цвета сняты с landing/index.html.</desc>
  <style>
    @import url("../../landing/fonts.css");
    /* Colour lives in style, never in a fill attribute: a class outranks the
       attribute, so a per-element fill="…" is thrown away and the label is
       painted in the class colour on top of its own ground. */
    .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #ede8dd; }
    .body  { font-size: 13px; font-weight: 500; fill: #ede8dd; }
    .msg   { font-size: 14px; font-weight: 500; fill: #ede8dd; }
    .small { font-size: 11px; font-weight: 500; fill: #ede8dd; }
    .muted { font-size: 12px; font-weight: 500; fill: #928979; }
    .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #928979; }
    .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #c6a24e; font-weight: 600; }
    .warn  { font-size: 11px; font-weight: 600; fill: #c6a24e; }
    .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #c6a24e; font-weight: 600; }
    /* The same drawing again, on the light ground. Only the values differ — the
       geometry, the wording and the layout are one thing drawn twice. */
    .on-light .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #181510; }
    .on-light .body  { font-size: 13px; font-weight: 500; fill: #181510; }
    .on-light .msg   { font-size: 14px; font-weight: 500; fill: #181510; }
    .on-light .small { font-size: 11px; font-weight: 500; fill: #181510; }
    .on-light .muted { font-size: 12px; font-weight: 500; fill: #5c5749; }
    .on-light .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #5c5749; }
    .on-light .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #5c5749; font-weight: 600; }
    .on-light .warn  { font-size: 11px; font-weight: 600; fill: #735b25; }
    .on-light .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #5c5749; font-weight: 600; }
  </style>
