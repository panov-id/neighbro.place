<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1372" viewBox="0 0 1440 1372" font-family="Golos Text, system-ui, sans-serif">
  <title>neighbro — screen 12, a link inside a chat</title>
  <desc>You share your link once and by hand. Someone else's opens only after a warning. Нарисовано по ../../docs/12-*_RU.md; цвета сняты с landing/index.html.</desc>
  <style>
    @import url("../../landing/fonts.css");
    /* Colour lives in style, never in a fill attribute: a class outranks the
       attribute, so a per-element fill="…" is thrown away and the label is
       painted in the class colour on top of its own ground. */
    .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #ede8dd; }
    .body  { font-size: 13px; font-weight: 500; fill: #ede8dd; }
    .msg   { font-size: 14px; font-weight: 500; fill: #ede8dd; }
    .small { font-size: 11px; font-weight: 500; fill: #ede8dd; }
    .muted { font-size: 12px; font-weight: 500; fill: #928979; }
    .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #928979; }
    .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #c6a24e; font-weight: 600; }
    .warn  { font-size: 11px; font-weight: 600; fill: #c6a24e; }
    /* neighbro's prototype sets a live message's timer in the accent, uppercase
       and wide. sosed has no such thing — there the timer is a plain caption. */
    .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #c6a24e; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="1440" height="1372" rx="0" fill="#0c0b09"/>
    <g transform="translate(48,40)">
      <rect x="0" y="0" width="1344" height="104" rx="16" fill="#c6a24e"/>
      <text x="28" y="46" class="disp" font-size="30" style="fill:#1a1509">Screen 12. a link inside a chat</text>
      <text x="28" y="74" class="body" style="fill:#1a1509">You share your link once and by hand. Someone else's opens only after a warning.</text>
      <text x="1316" y="46" class="mono" style="fill:#1a1509" text-anchor="end">design/interface/12-share-link.svg</text>
      <text x="1316" y="74" class="mono" style="fill:#1a1509" text-anchor="end">по ../../docs/12-share-link-in-chat_RU.md</text>
    </g>
    <g transform="translate(48,184)">
      <text x="0" y="16" class="disp" font-size="19">Phone · 390 × 844</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a331f" stroke-width="1"/>
      <text x="0" y="48" class="muted">True geometry, no scaling.</text>
    </g>
  <g transform="translate(48,256)">
    <text x="0" y="0" class="brow">THE HIDDEN MENU</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0c0b09"/>
      <g opacity="0.45">
        <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
        <rect x="16" y="44" width="128" height="30" rx="15" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
        <path d="M32 52 q6 0 6 6 q0 5 -6 10 q-6 -5 -6 -10 q0 -6 6 -6 z" fill="none" stroke="#c6a24e" stroke-width="2"/>
        <text x="46" y="64" class="mono">private</text>
        <circle cx="166" cy="59" r="4" fill="#c6a24e"/>
        <text x="178" y="63" class="small">NEUKÖLLN · 29</text>
        <rect x="258" y="44" width="100" height="30" rx="15" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
        <circle cx="276" cy="59" r="7" fill="none" stroke="#928979" stroke-width="1"/>
        <text x="292" y="63" class="small">You</text>
        <line x1="0" y1="96" x2="374" y2="96" stroke="#3a331f" stroke-width="1"/>
        <rect x="16" y="140" width="300" height="64" rx="16" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
        <text x="32" y="166" class="msg">I will send you where.</text>
        <text x="32" y="188" class="mono">14:40</text>
      </g>
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0c0b09" opacity="0.62"/>
      <g transform="translate(0,460)">
  <path d="M0 40 A35 35 0 0 1 35 5 L339 5 A35 35 0 0 1 374 40 L374 368 L0 368 Z" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
  <rect x="163" y="18" width="48" height="4" rx="2" fill="#3a331f"/>
  <text x="24" y="58" class="disp" font-size="18">This chat</text>
  <text x="24" y="126" class="msg">Share my link</text>
  <text x="24" y="150" class="mono">the one from settings — once, into this chat</text>
  <line x1="24" y1="174" x2="350" y2="174" stroke="#3a331f" stroke-width="1"/>
  <text x="24" y="210" class="msg">Report</text>
  <line x1="24" y1="234" x2="350" y2="234" stroke="#3a331f" stroke-width="1"/>
  <text x="24" y="270" class="msg">Block</text>
  <line x1="24" y1="294" x2="350" y2="294" stroke="#3a331f" stroke-width="1"/>
  <text x="24" y="330" class="msg" style="fill:#928979">Cancel</text>
</g>
    </g>
  </g>
  <g transform="translate(525,256)">
    <text x="0" y="0" class="brow">THE WARNING</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0c0b09"/>
      <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0c0b09"/>
      <rect x="28" y="300" width="318" height="228" rx="16" fill="#14120e" stroke="#3a331f" stroke-width="1"/>
      <text x="48" y="340" class="brow">AN OUTSIDE LINK</text>
      <text x="48" y="376" class="msg">You are leaving neighbro.place</text>
      <text x="48" y="400" class="msg">for a site that is not ours.</text>
      <text x="48" y="430" class="mono">example.com/…</text>
      <rect x="48" y="452" width="140" height="44" rx="12" fill="#c6a24e"/>
      <text x="118.0" y="480" class="small" style="fill:#1a1509;font-weight:700" text-anchor="middle">Go</text>
      <rect x="206" y="452" width="140" height="44" rx="12" fill="none" stroke="#3a331f" stroke-width="1"/>
      <text x="276.0" y="480" class="small" text-anchor="middle">Cancel</text>
      <text x="187" y="580" class="mono" text-anchor="middle">the warning comes before the jump,</text>
      <text x="187" y="598" class="mono" text-anchor="middle">not after</text>
    </g>
  </g>
    <g transform="translate(48,1160)">
      <text x="0" y="16" class="disp" font-size="19">Left open by the screen's description</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a331f" stroke-width="1"/>
    </g>
    <g transform="translate(48,1200)">
      <rect x="0" y="0" width="1344" height="88" rx="16" fill="#14120e" stroke="#c6a24e" stroke-width="2"/>
      <text x="24" y="34" class="warn">The description leaves nothing open here.</text>
      <text x="24" y="58" class="body">The link is plain, tied to no platform — the same field as on screen 10.</text>
    </g>
    <g transform="translate(48,1312)">
      <rect x="0" y="-8" width="1344" height="36" rx="10" fill="#26221a" stroke="#3a331f" stroke-width="1"/>
      <text x="24" y="16" class="mono">Цвета — landing/index.html, шрифт — landing/fonts.css. Брат: sosed.place/design/interface/</text>
    </g>
</svg>
