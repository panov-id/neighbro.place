name: checks

# The landing had no CI at all: the first thing that ever ran its code was a
# deploy, which is the worst place to learn that the content policy refuses the
# page. This runs before one, on every branch, so a mistake is caught on the day
# branch it was made on.
#
# Nothing here reaches the network.
on:
  push:
    branches: ["**"]
    paths: ["landing/**", "deploy/**", ".github/workflows/checks.yml"]
  pull_request:
    paths: ["landing/**", "deploy/**", ".github/workflows/checks.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: the documents do not contradict each other
        run: node landing/check-legal-consistency.mjs

      # A document that misdates itself is a consent record pointing at the
      # wrong text, and it happened: the guidelines changed on 2026-08-27 and
      # kept announcing 13 August. This runs on every branch so the day the
      # header and the bytes part ways is the day it is caught.
      - name: every document's date matches its text
        run: python3 deploy/check-legal-revisions.py

      - name: and the check itself goes red when broken
        run: python3 deploy/check-legal-revisions.py --self-test

      - name: the policy this landing will be served under
        run: bash landing/test-security-headers.sh

      - name: no secret on a command line
        run: python3 deploy/test-no-secrets-in-argv.py

      # The guard that stands between the landing directory and a live zone, and
      # the prune that runs after it. Both shipped without tests of their own,
      # which left a deploy as the first thing that would ever exercise them.
      - name: a file nobody allowed stops the deploy
        run: python3 deploy/test-check-shipped-files.py

      - name: what the prune refuses to delete
        run: python3 deploy/test-prune-storage-zone.py

      - name: the release tag survives a re-run
        run: python3 deploy/test-release-tag.py
