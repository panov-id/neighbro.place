name: Deploy prod

# Manual promotion: pick a release tag (already validated on UAT) → deploy prod.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to deploy (e.g. v2026.07.06-abc1234)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy landing
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_STORAGE_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          RELAY_API_URL: ${{ secrets.RELAY_API_URL }}
          # The Article 16 intake has a host of its own, outside the blocking
          # WAF on the api host: a notice quoting a <script> tag or a ../ path
          # is refused there (measured 03.09.2026). Public address, not a secret.
          RELAY_REPORT_URL: https://report.relay.panov.id
          RELAY_PUBLISHABLE_KEY: ${{ secrets.RELAY_PUBLISHABLE_KEY }}
          # Аналитика снята 11.09.2026 вместе с последним основанием на согласии
          # (реестр по ст. 30, §9): согласие тянуло за собой ст. 8 GDPR, то есть
          # вопрос о возрасте цифрового согласия и о родителе, механизма для
          # которого у продукта нет. Политика уже говорит, что счётчика нет —
          # значит его не должно быть и в выкате. Переменная не передаётся, и
          # пустой analyticsId в config.js не грузит скрипт и не рисует баннер.
          # Секрет в репозитории оставлен: значение публично видно в config.js и
          # секретом не является, а решение должно жить здесь, а не в кабинете.
          SEARCH_CONSOLE_TOKEN: ${{ secrets.SEARCH_CONSOLE_TOKEN }}
          LANDING_ENV: prod
          RUN_NODE_NATIVE: '1'
        run: bash deploy/deploy-landing.sh
