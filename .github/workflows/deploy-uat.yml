name: Deploy UAT

# Merge/push to main → cut a dated release tag → deploy that tag to UAT.
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        name: Create release tag
        run: |
          # Semver, or the image never gets built. docker/metadata-action emits a
          # semver image tag only for a valid version, and "2026.08.05" is not one:
          # a leading zero makes it invalid, so the tag existed in git and nowhere
          # in the registry. %-m/%-d drop the padding.
          #
          # The sha carries a "g" prefix (git describe's convention) so it can
          # never be read as a numeric pre-release identifier — those may not have
          # a leading zero either, and a sha of all digits starting with one would
          # break the same way, rarely and unforgettably.
          TAG="v$(date +%Y.%-m.%-d)-g${GITHUB_SHA::7}"
          # Idempotent: a re-run of the same commit must not fail on an existing
          # tag. It did, and the failure had the worst shape — `release` went red
          # and everything depending on it was skipped, so re-running, which is
          # the first thing a person reaches for after a bad deploy, could not
          # work. sosed.place already did this; these two had not.
          git tag "$TAG" 2>/dev/null || echo "tag $TAG already exists locally"
          git push origin "$TAG" 2>/dev/null || echo "tag $TAG already on remote"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Created release $TAG"

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy landing
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_STORAGE_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          RELAY_API_URL: ${{ secrets.RELAY_API_URL }}
          RELAY_PUBLISHABLE_KEY: ${{ secrets.RELAY_PUBLISHABLE_KEY }}
          LANDING_ENV: uat
          RUN_NODE_NATIVE: '1'
          SITE_ORIGIN: https://uat.neighbro.panov.id
        run: bash deploy/deploy-landing.sh
